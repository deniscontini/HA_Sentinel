[project]
name = "ha-sentinel"
version = "0.1.0"
description = "Home Assistant integration that detects and visualizes attack attempts"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = ["dev"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["PLR0917", "PLR0911", "PLR0912", "PLR0913", "PLR2004", "PLR0915", "RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.ha_sentinel"]
combine-as-imports = true
